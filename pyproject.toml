[project]
name = "fde-trainer"
version = "1.0.0"
description = "Local learning app: from zero to interview-ready for Forward Deployed Engineer roles"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["static/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["server"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
