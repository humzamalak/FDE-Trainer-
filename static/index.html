<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FDE Trainer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <a href="#/" class="brand">FDE Trainer</a>
  <nav>
    <a href="#/">Dashboard</a>
    <a href="#/playground">Playground</a>
    <a href="#/drill">Drill</a>
    <a href="#/review">Review</a>
    <a href="#/mock">Mock interviews</a>
  </nav>
  <button id="tutorToggle" class="btn primary">Ask tutor</button>
</header>

<div class="layout">
  <aside id="sidebar" class="sidebar"></aside>
  <main id="main" class="main"><p class="muted">Loading…</p></main>
  <aside id="tutor" class="tutor hidden">
    <div class="tutor-head">
      <strong>AI tutor</strong>
      <span id="tutorLesson" class="muted small"></span>
      <button id="tutorClear" class="btn small">Clear</button>
      <button id="tutorClose" class="btn small">✕</button>
    </div>
    <div id="tutorLog" class="chat-log"></div>
    <form id="tutorForm" class="chat-form">
      <textarea id="tutorInput" rows="3" placeholder="Ask a question about this lesson. Enter to send, Shift+Enter for a new line."></textarea>
      <button class="btn primary" type="submit">Send</button>
    </form>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
